<!DOCTYPE html>
<html lang="en-IN">
<head>
  <script>(function(){var F='instahelp-vendor-network',b='/';if(location.protocol==='file:'){var h=location.href.split('#')[0].split('?')[0];b=h.slice(0,h.lastIndexOf('/')+1);b=b.replace(/shop\/?$/,'').replace(/vendors\/apply\/?$/,'').replace(/vendor\/dashboard\/?$/,'').replace(/admin\/vendors\/?$/,'');var i=b.indexOf('/'+F+'/');if(i===-1){var j=b.indexOf('/'+F);if(j!==-1)b=b.slice(0,j+F.length+1);if(b.slice(-1)!=='/')b+='/';}}else{var p=location.pathname,i=p.indexOf('/'+F+'/');if(i!==-1)b=p.substring(0,i+F.length+2);}var el=document.createElement('base');el.setAttribute('data-ih-base','');el.href=b;var hd=document.head||document.documentElement;hd.insertBefore(el,hd.firstChild);window.INSTAHELP_BASE=b;})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store | InstaHelp</title>
  <meta name="theme-color" content="#131921">
  <link rel="icon" href="10.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/shop-templates.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body { margin: 0; font-family: Assistant, 'Plus Jakarta Sans', sans-serif; background: #EAEDED; color: #0F1111; }
    .shop-loader {
      min-height: 100dvh; display: grid; place-items: center; background: #EAEDED;
    }
    .shop-loader-inner { text-align: center; }
    .shop-mark {
      width: 36px; height: 36px; margin: 0 auto 12px;
      background: #FFD814; display: grid; place-items: center;
      font-weight: 800; font-size: 0.8rem;
    }
    .shop-loader h1 {
      margin: 0 0 6px; font-size: 1.5rem; font-weight: 700;
    }
    .shop-loader p { margin: 0; color: #565959; font-size: 0.875rem; }
    .shop-error { text-align: center; padding: 4rem 1.5rem; max-width: 28rem; }
    .shop-error h2 { margin: 0 0 0.55rem; font-size: 1.75rem; font-weight: 700; }
    .shop-error p { margin: 0 0 1.25rem; color: #565959; font-size: 1rem; }
    .shop-error a { color: #007185; font-weight: 700; font-size: 1rem; }
    .share-bar { position: fixed; top: 64px; right: 12px; z-index: 80; display: flex; gap: 6px; }
    .share-btn {
      width: 32px; height: 32px; border-radius: 2px; background: #fff;
      border: 1px solid #D5D9D9; display: grid; place-items: center; cursor: pointer;
      color: #0F1111; padding: 0;
    }
    .share-btn:focus-visible { outline: 2px solid #12141A; outline-offset: 2px; }
    .share-btn svg { width: 18px; height: 18px; display: block; }
    @media (max-width: 768px) { .share-bar { top: auto; bottom: 5.4rem; right: 0.85rem; flex-direction: column; } }
    .qr-overlay {
      position: fixed; inset: 0; z-index: 120; background: rgba(18,20,26,0.45);
      display: none; place-items: center; padding: 1.25rem;
    }
    .qr-overlay.open { display: grid; }
    .qr-card {
      width: min(100%, 360px); background: #fff; border-radius: 4px;
      padding: 1.25rem 1.25rem 1.4rem; text-align: center;
      border: 1px solid #D5D9D9;
    }
    .qr-card header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .qr-card h3 { margin: 0; font-size: 1.4rem; letter-spacing: -0.03em; }
    .qr-card button {
      width: 32px; height: 32px; border: 0; border-radius: 8px; background: #F6F5F0;
      cursor: pointer; font-size: 1.15rem; line-height: 1;
    }
    #qr-code { display: grid; place-items: center; min-height: 200px; }
    #qr-url { margin: 0.9rem 0 0; color: #5C5F66; font-size: 0.8rem; word-break: break-all; }
  </style>
</head>
<body>
  <div id="shop-loader" class="shop-loader">
    <div class="shop-loader-inner">
      <div class="shop-mark">IH</div>
      <h1>InstaHelp</h1>
      <p>Opening store</p>
    </div>
  </div>
  <div id="shop-root" hidden></div>
  <div class="share-bar" id="share-bar" hidden>
    <button type="button" class="share-btn" id="btn-share" title="Share" aria-label="Share store">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
    </button>
    <button type="button" class="share-btn" id="btn-qr" title="QR code" aria-label="Show QR code">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v7M14 20h3"/></svg>
    </button>
  </div>
  <div class="qr-overlay" id="qr-modal" hidden>
    <div class="qr-card" role="dialog" aria-labelledby="qr-title">
      <header>
        <h3 id="qr-title">Scan to open store</h3>
        <button type="button" id="qr-close" aria-label="Close">x</button>
      </header>
      <div id="qr-code"></div>
      <p id="qr-url"></p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/shop-templates.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    var shopSlug = '';
    document.addEventListener('DOMContentLoaded', function() {
      shopSlug = InstaHelp.getShopSlugFromPath();
      if (!shopSlug) { showError('Store not found'); return; }

      var traffic = InstaHelp.getQueryParam('utm_source') || document.referrer || 'direct';
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res.success) { showError(res.error || 'Store not found'); return; }
          var store = res.store;
          StoreActions.setVendor(store.vendor);
          var root = document.getElementById('shop-root');
          root.innerHTML = StoreTemplates.render(store);
          root.hidden = false;
          document.getElementById('shop-loader').style.display = 'none';
          document.title = store.vendor.BusinessName + ' | InstaHelp';
          document.getElementById('share-bar').hidden = false;
          google.script.run.recordView(store.vendor.VendorID, traffic);
          setupShare(store.vendor);
        })
        .withFailureHandler(function(err) { showError(err.message); })
        .getVendorStore(shopSlug);
    });

    function showError(msg) {
      document.getElementById('shop-loader').innerHTML =
        '<div class="shop-error"><h2>Store unavailable</h2><p>' + String(msg || 'Try again later.') +
        '</p><a href="/">Back to InstaHelp</a></div>';
    }

    function closeQr() {
      var m = document.getElementById('qr-modal');
      m.classList.remove('open');
      m.hidden = true;
    }

    function setupShare(v) {
      var url = INSTAHELP_CONFIG.getShopUrl(v.ShopSlug);
      document.getElementById('btn-share').onclick = function() {
        if (navigator.share) navigator.share({ title: v.BusinessName, url: url });
        else InstaHelp.copyToClipboard(url);
      };
      document.getElementById('btn-qr').onclick = function() {
        document.getElementById('qr-code').innerHTML = '';
        new QRCode(document.getElementById('qr-code'), { text: url, width: 200, height: 200 });
        document.getElementById('qr-url').textContent = url;
        var m = document.getElementById('qr-modal');
        m.hidden = false;
        m.classList.add('open');
      };
      document.getElementById('qr-close').onclick = closeQr;
      document.getElementById('qr-modal').onclick = function(e) {
        if (e.target === this) closeQr();
      };
    }
  </script>
</body>
</html>
